version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-type: all
    rebase-strategy: auto
    assignees:
      - poad

  - package-ecosystem: npm
    directories:
      - '/'
      - '/aws-cdk/'
      - '/databricks-external-location/'
    schedule:
      interval: daily
      timezone: Asia/Tokyo
    allow:
      - dependency-type: all
    rebase-strategy: auto
    cooldown:
      default-days: 7
    assignees:
      - poad
    groups:
      miscs:
        patterns:
          - "*"
