packages:
  - .
  - aws-cdk
  - databricks-external-location

allowBuilds:
  '@pulumi/std': false
  esbuild: false
  protobufjs: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.20.0

overrides:
  semver: '>=7'

trustPolicy: no-downgrade
